# ci.yml — Runs automatically on every push and pull request.
# Verifies the backend installs correctly and passes real tests,
# the frontend builds correctly, and both Docker images build successfully.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend - install & run tests
    runs-on: ubuntu-latest

    # A temporary Postgres container, available only to this job,
    # for the duration of this job -- this is what our integration
    # tests (Task 17.3) need to actually run in CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enterprise_ai_user
          POSTGRES_PASSWORD: enterprise_ai_password
          POSTGRES_DB: enterprise_ai_test
        ports:
          - 5432:5432
        # Waits for Postgres to actually be ready before the job
        # continues -- same idea as our docker-compose healthchecks.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://enterprise_ai_user:enterprise_ai_password@localhost:5432/enterprise_ai_test"
          GEMINI_API_KEY: "dummy-key-for-ci"
          JWT_SECRET_KEY: "dummy-secret-for-ci"
          MOCK_MODE: "true"
        run: pytest tests/ -v

  frontend-check:
    name: Frontend - install & build check
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build the frontend
        working-directory: frontend
        run: npm run build

  docker-build-check:
    name: Docker images build successfully
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t enterprise-ai-backend ./backend

      - name: Build frontend image
        run: docker build -t enterprise-ai-frontend ./frontend
