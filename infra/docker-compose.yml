# docker-compose.yml
# Defines every container our app needs, and how they connect.
# Run with: docker compose -f infra/docker-compose.yml up

services:
  backend:
    build: ../backend
    container_name: enterprise-ai-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env.docker
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build: ../frontend
    container_name: enterprise-ai-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build: ../backend
    container_name: enterprise-ai-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env.docker
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build: ../frontend
    container_name: enterprise-ai-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: enterprise-ai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + web dashboard
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.24
    container_name: enterprise-ai-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/enterprise_ai_password   # format: username/password
    ports:
      - "7474:7474"   # Neo4j Browser (web UI)
      - "7687:7687"   # Bolt protocol (used by our Python app)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16                 # official Postgres image, version pinned deliberately
    container_name: enterprise-ai-postgres
    restart: unless-stopped            # auto-restart if it crashes, but not if you deliberately stop it
    environment:
      POSTGRES_USER: enterprise_ai_user
      POSTGRES_PASSWORD: enterprise_ai_password   # dev-only password; real secrets handled properly by Step 15
      POSTGRES_DB: enterprise_ai
    ports:
      - "5432:5432"                    # host_port:container_port
    volumes:
      - postgres_data:/var/lib/postgresql/data   # persists real DB files outside the container
    healthcheck:                        # lets Docker know when Postgres is actually ready, not just "started"
      test: ["CMD-SHELL", "pg_isready -U enterprise_ai_user -d enterprise_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:                        # Docker manages this named volume's actual location for us

networks:
  default:
    name: enterprise-ai-network
